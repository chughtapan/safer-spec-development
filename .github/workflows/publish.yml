name: publish

# Publish @chughtapan/safer-spec-development to npm when a vX.Y.Z tag is pushed.
# Consumers (brief, safer-by-default) then `bun add -D @chughtapan/safer-spec-development`
# instead of vendoring a plain copy. Requires an NPM_TOKEN repo secret with publish
# rights to the @chughtapan scope. `publishConfig.access` in package.json is "public",
# so the scoped package publishes publicly without an extra flag.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install deps
        run: npm install
      - name: Build (emits dist/ that main/bin/exports point at)
        run: npm run build
      - name: Guard — tag must match package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"; exit 1
          fi
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
